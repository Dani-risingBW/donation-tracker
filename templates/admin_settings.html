<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings | 25:35</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}">25:35</a><nav><a href="{{ url_for('admin_dashboard') }}">Review queue</a><a href="{{ url_for('admin_logout') }}">Log out</a></nav></header><main class="narrow"><section class="form-card"><p class="eyebrow">Campaign settings</p><h1>Update fundraiser</h1><form method="post"><label for="goal">Goal</label><input id="goal" name="goal" type="number" min="1" step="0.01" value="{{ campaign.goal }}"><label for="cashtag">Cash App cashtag</label><input id="cashtag" name="cashtag" value="{{ campaign.cashtag }}"><label for="end_date">End date</label><input id="end_date" name="end_date" type="date" value="{{ campaign.end_date }}"><label for="distribution">Distribution details</label><textarea id="distribution" name="distribution" rows="4">{{ campaign.distribution }}</textarea><h2>Item goals</h2>{% for item in campaign['items'] %}<div class="settings-row"><strong>{{ item.name }}</strong><input aria-label="{{ item.name }} value" name="item_value_{{ item.id }}" type="number" min="0.01" step="0.01" value="{{ item.value }}"><input aria-label="{{ item.name }} target" name="item_target_{{ item.id }}" type="number" min="1" value="{{ item.target }}"></div>{% endfor %}<button class="button" type="submit">Save settings</button></form></section></main></body></html>
